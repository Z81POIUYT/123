name: Build ShawarmaEvents plugin variants

# The installed YYToolkit.dll (built 2026-03-03) does not match the headers at the v5.0.0c tag,
# so this builds the plugin against several candidate YYToolkit commits (one DLL each).
# Put ALL the resulting DLLs into mods\Aurie: the ones that do not fit just log an error and unload themselves.
on:
  push:
  workflow_dispatch:

jobs:
  pick:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        name: Pick candidate YYToolkit commits
        shell: bash
        run: |
          git clone https://github.com/AurieFramework/YYToolkit.git yytk
          cd yytk
          DEF=$(git remote show origin | sed -n 's/.*HEAD branch: //p')
          echo "default branch: $DEF"
          git log -1 --format='tag v5.0.0c: %H %cI %s' v5.0.0c || true
          BUILT="2026-03-03T16:52:18Z"
          A=$(git rev-list -n 1 --before="$BUILT" "origin/$DEF" || true)
          B=$(git log --reverse --format=%H --after="$BUILT" "origin/$DEF" | head -1 || true)
          HFILES=$(git ls-files | grep -i "YYTK_Shared" || true)
          C=$(git log --reverse --format=%H -S"YYTK_ZeusMain" "origin/$DEF" -- $HFILES | head -1 || true)
          D=$(git rev-parse "origin/$DEF")
          items=""
          seen=" "
          add() {
            local name="$1" sha="$2"
            if [ -z "$sha" ]; then return; fi
            case "$seen" in *" $sha "*) return;; esac
            seen="$seen$sha "
            items="$items{\"name\":\"${name}_${sha:0:7}\",\"ref\":\"$sha\"},"
            git log -1 --format="candidate $name: %H %cI %s" "$sha"
          }
          add before "$A"
          add after "$B"
          add zeusmain "$C"
          add head "$D"
          items="${items%,}"
          echo "matrix={\"include\":[$items]}" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

      - name: Inspect the official v5.0.0c release files (looking for headers that match the DLL)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release_info
          gh release view v5.0.0c --repo AurieFramework/YYToolkit --json tagName,name,publishedAt,targetCommitish,assets > release_info/release.json || true
          cat release_info/release.json || true
          gh release download v5.0.0c --repo AurieFramework/YYToolkit --dir release_assets || true
          ls -la release_assets > release_info/assets_list.txt 2>&1 || true
          cat release_info/assets_list.txt
          for z in release_assets/*.zip; do
            [ -f "$z" ] || continue
            echo "== $z" >> release_info/zip_contents.txt
            unzip -l "$z" >> release_info/zip_contents.txt 2>&1 || true
            mkdir -p "release_extract/$(basename "$z" .zip)"
            unzip -q -o "$z" -d "release_extract/$(basename "$z" .zip)" || true
          done
          grep -rn --include="*.hpp" --include="*.h" -E "GetInterface|YYTK_Zeus|\"YYTK_" release_extract > release_info/release_header_lines.txt 2>/dev/null || true
          head -60 release_info/zip_contents.txt 2>/dev/null || true
          head -40 release_info/release_header_lines.txt

      - name: Upload release info
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ShawarmaEvents-release-info
          path: release_info

  build:
    needs: pick
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.pick.outputs.matrix) }}
    env:
      _CL_: /std:c++latest
    steps:
      - name: Get YYToolkit source (${{ matrix.name }})
        shell: bash
        run: |
          git clone https://github.com/AurieFramework/YYToolkit.git yytk
          cd yytk
          git checkout -q ${{ matrix.ref }}
          git submodule update --init --recursive || true
          git log -1 --format="%H %cI %s"
          ls -la
          ls -la ExamplePlugin

      - name: Get Aurie source (v2.0.2, same version as the installed AurieCore.dll)
        shell: bash
        run: |
          git clone --depth 1 --branch v2.0.2 https://github.com/AurieFramework/Aurie.git aurie
          cd aurie
          git log -1 --oneline
          echo "--- shared files in Aurie:"
          find . -iname "shared*" | head -40

      - name: Write the plugin source into the ExamplePlugin project
        shell: pwsh
        run: |
          $cands = Get-ChildItem yytk/ExamplePlugin -Filter *.cpp -Recurse
          $ex = $cands | Where-Object { (Get-Content $_.FullName -Raw) -match 'EXPORTED\s+AurieStatus\s+ModuleInitialize' } | Select-Object -First 1
          if (-not $ex) { $ex = $cands | Where-Object { (Get-Content $_.FullName -Raw) -match 'ModuleInitialize\s*\(' } | Select-Object -First 1 }
          if (-not $ex) { throw "No ExamplePlugin source containing ModuleInitialize was found" }
          Write-Host "Replacing: $($ex.FullName)"
          $head = @(Get-Content $ex.FullName | Where-Object { $_ -match '^\s*(#include|using namespace)' })
          Write-Host "---- includes kept from the original file:"
          $head | ForEach-Object { Write-Host $_ }
          $body = @'
          // ======================================================================
          // Shawarma Legend event probe (YYToolkit v5 plugin), v3. ASCII only on purpose.
          // Logs object events (Create / Alarm / Other / Step ...) of the objects listed in
          // shawarma_watch.txt, plus F7 / F8 / F9 key marks, to shawarma_events.log.
          // ======================================================================
          #if __has_include(<Windows.h>)
          #include <Windows.h>
          #endif
          #include <chrono>
          #include <cstdio>
          #include <cstring>
          #include <filesystem>
          #include <fstream>
          #include <string>
          #include <tuple>
          #include <unordered_map>
          #include <unordered_set>
          #include <vector>

          using namespace Aurie;
          using namespace YYTK;

          namespace sl
          {
              struct State
              {
                  std::ofstream log;
                  std::vector<std::string> watch;
                  bool watch_all = false;
                  bool disabled = false;
                  LARGE_INTEGER freq{};
                  LARGE_INTEGER t0{};
                  std::unordered_map<std::string, double> last_noisy;
                  ULONGLONG last_key_tick = 0;
                  ULONGLONG last_stat_tick = 0;
                  bool key_down[3] = { false, false, false };
                  unsigned long long events_seen = 0;
                  unsigned long long events_logged = 0;
                  std::unordered_set<std::string> raw_seen; // distinct event names seen so far (inventory, first 80)
                  int faults = 0;
              };

              State* g = nullptr; // allocated in ModuleInitialize, never freed (process lifetime)

              double NowMs()
              {
                  LARGE_INTEGER t{};
                  QueryPerformanceCounter(&t);
                  return double(t.QuadPart - g->t0.QuadPart) * 1000.0 / double(g->freq.QuadPart);
              }

              void Note(const char* text)
              {
                  if (g && g->log.is_open())
                  {
                      g->log << "# " << text << "\n";
                      g->log.flush();
                  }
              }

              void Write(const char* kind, const char* name, const void* ptr, double now)
              {
                  char buf[600];
                  int n = std::snprintf(buf, sizeof(buf), "%.1f\t%s\t%s\t%p\n", now, kind, name, ptr);
                  if (n > 0 && g->log.is_open())
                  {
                      g->log.write(buf, n);
                      g->log.flush();
                  }
              }

              // The code-entry name accessor differs between YYToolkit versions: detect it at compile time.
              template <typename T>
              const char* CodeName(T* code)
              {
                  if constexpr (requires { code->GetName(); })
                      return code->GetName();
                  else if constexpr (requires { code->i_pName; })
                      return code->i_pName;
                  else
                      return nullptr;
              }

              bool CopyNameUnsafe(CCode* code, char* out, size_t cap)
              {
                  const char* n = CodeName(code);
                  if (!n)
                      return false;
                  size_t i = 0;
                  for (; i + 1 < cap && n[i] != '\0'; ++i)
                      out[i] = n[i];
                  out[i] = '\0';
                  return true;
              }

              // Copies the code name into a local buffer. A bad pointer must never take the game down.
              bool CopyName(CCode* code, char* out, size_t cap)
              {
          #if defined(_MSC_VER)
                  __try
                  {
                      return CopyNameUnsafe(code, out, cap);
                  }
                  __except (EXCEPTION_EXECUTE_HANDLER)
                  {
                      return false;
                  }
          #else
                  return CopyNameUnsafe(code, out, cap);
          #endif
              }

              bool IsNoisy(const char* name)
              {
                  return std::strstr(name, "_Step_") != nullptr || std::strstr(name, "_Draw_") != nullptr;
              }

              void PollKeys()
              {
                  ULONGLONG tick = GetTickCount64();
                  if (tick - g->last_key_tick < 30)
                      return;
                  g->last_key_tick = tick;

                  static const int keys[3] = { VK_F7, VK_F8, VK_F9 };
                  static const char* labels[3] = { "F7", "F8", "F9" };
                  for (int i = 0; i < 3; ++i)
                  {
                      bool down = (GetAsyncKeyState(keys[i]) & 0x8000) != 0;
                      if (down && !g->key_down[i])
                          Write("MARK", labels[i], nullptr, NowMs());
                      g->key_down[i] = down;
                  }
              }

              void OnObjectEventInner(FWCodeEvent& Event)
              {
                  auto&& args = Event.Arguments();
                  CInstance* self = std::get<0>(args);
                  CCode* code = std::get<2>(args);
                  if (!code)
                      return;

                  g->events_seen++;
                  PollKeys();

                  char namebuf[256];
                  if (!CopyName(code, namebuf, sizeof(namebuf)))
                      return;

                  ULONGLONG tick = GetTickCount64();
                  if (g->last_stat_tick == 0 || tick - g->last_stat_tick >= 10000)
                  {
                      g->last_stat_tick = tick;
                      char stat[120];
                      std::snprintf(stat, sizeof(stat), "events_seen=%llu logged=%llu", g->events_seen, g->events_logged);
                      Write("STAT", stat, nullptr, NowMs());
                  }

                  if (g->raw_seen.size() < 80 && g->raw_seen.insert(namebuf).second)
                      Write("RAW", namebuf, static_cast<const void*>(self), NowMs());

                  if (std::strncmp(namebuf, "gml_Object_", 11) != 0)
                      return;
                  const char* name = namebuf + 11; // strip the common prefix

                  bool hit = g->watch_all;
                  if (!hit)
                  {
                      for (const auto& w : g->watch)
                      {
                          if (std::strstr(name, w.c_str()) != nullptr)
                          {
                              hit = true;
                              break;
                          }
                      }
                  }
                  if (!hit)
                      return;

                  double now = NowMs();
                  if (IsNoisy(name))
                  {
                      // Step / Draw events fire every frame: log at most once per second per instance.
                      char keybuf[300];
                      std::snprintf(keybuf, sizeof(keybuf), "%s@%p", name, static_cast<const void*>(self));
                      std::string key(keybuf);
                      auto it = g->last_noisy.find(key);
                      if (it != g->last_noisy.end() && now - it->second < 1000.0)
                          return;
                      if (g->last_noisy.size() > 4000)
                          g->last_noisy.clear();
                      g->last_noisy[key] = now;
                  }
                  g->events_logged++;
                  Write("EVT", name, static_cast<const void*>(self), now);
              }

              void OnFault()
              {
                  if (!g)
                      return;
                  g->faults++;
                  char text[100];
                  std::snprintf(text, sizeof(text), "FAULT in event callback (#%d)", g->faults);
                  Note(text);
                  if (g->faults >= 3)
                  {
                      g->disabled = true;
                      Note("callback disabled after 3 faults");
                  }
              }

              // Entry point called by YYToolkit for every object event. Wrapped so that no exception can reach the game.
              void OnObjectEvent(FWCodeEvent& Event)
              {
                  if (!g || g->disabled)
                      return;
          #if defined(_MSC_VER)
                  __try
                  {
                      OnObjectEventInner(Event);
                  }
                  __except (EXCEPTION_EXECUTE_HANDLER)
                  {
                      OnFault();
                  }
          #else
                  try
                  {
                      OnObjectEventInner(Event);
                  }
                  catch (...)
                  {
                      OnFault();
                  }
          #endif
              }

              bool CreateCallbackGuarded(YYTKInterface* y, AurieModule* m, int* out_status)
              {
          #if defined(_MSC_VER)
                  __try
                  {
                      *out_status = static_cast<int>(y->CreateCallback(m, EVENT_OBJECT_CALL, reinterpret_cast<PVOID>(&OnObjectEvent), 0));
                      return true;
                  }
                  __except (EXCEPTION_EXECUTE_HANDLER)
                  {
                      return false;
                  }
          #else
                  *out_status = static_cast<int>(y->CreateCallback(m, EVENT_OBJECT_CALL, reinterpret_cast<PVOID>(&OnObjectEvent), 0));
                  return true;
          #endif
              }

              // Try to fetch the YYToolkit interface by name through Aurie. Only compiled in if the call is valid for this Aurie version.
              template <typename TBase>
              bool TryGetByName(const char* name, TBase*& out, int& status_code)
              {
                  if constexpr (requires { ObGetInterface(name, out); })
                  {
                      status_code = static_cast<int>(ObGetInterface(name, out));
                      return status_code == static_cast<int>(AURIE_SUCCESS) && out != nullptr;
                  }
                  else
                  {
                      status_code = -1;
                      return false;
                  }
              }

              YYTKInterface* AcquireInterface()
              {
                  // 1) the documented v5 way
                  YYTKInterface* iface = YYTK::GetInterface();
                  Note(iface ? "interface: YYTK::GetInterface() ok" : "interface: YYTK::GetInterface() returned nullptr");
                  if (iface)
                      return iface;

                  // 2) by name (the v5 preview registers itself as YYTK_ZeusMain)
                  static const char* names[] = { "YYTK_ZeusMain", "YYTK_Main" };
                  for (const char* n : names)
                  {
                      AurieInterfaceBase* base = nullptr;
                      int code = 0;
                      bool ok = TryGetByName(n, base, code);
                      std::string text = std::string("interface: ObGetInterface(") + n + ") status=" + std::to_string(code) + (ok ? " ok" : " failed");
                      Note(text.c_str());
                      if (ok)
                          return reinterpret_cast<YYTKInterface*>(base);
                  }
                  return nullptr;
              }

              void LoadWatch(const std::filesystem::path& dir)
              {
                  static const char* defaults[] = {
                      "obj_zbon", "obj_anger", "obj_order", "obj_sandwich", "obj_sandwitch",
                      "obj_thief", "obj_coin", "obj_rate", "obj_timeout", "obj_you_are"
                  };

                  std::filesystem::path path = dir / "shawarma_watch.txt";
                  std::ifstream in(path);
                  if (in.is_open())
                  {
                      std::string line;
                      while (std::getline(in, line))
                      {
                          while (!line.empty() && (line.back() == '\r' || line.back() == ' ' || line.back() == '\t'))
                              line.pop_back();
                          size_t start = 0;
                          while (start < line.size() && (line[start] == ' ' || line[start] == '\t'))
                              ++start;
                          line = line.substr(start);
                          if (line.empty() || line[0] == '#')
                              continue;
                          if (line == "ALL")
                              g->watch_all = true;
                          else
                              g->watch.push_back(line);
                      }
                  }
                  else
                  {
                      std::ofstream out(path);
                      if (out.is_open())
                      {
                          out << "# One keyword per line. An event is logged when its name contains the keyword.\n";
                          out << "# Example event name: obj_zbon_Create_0 (object obj_zbon, Create event).\n";
                          for (const char* d : defaults)
                              out << d << "\n";
                          out << "# Remove the # in front of ALL to log every object (the log gets huge).\n";
                          out << "# ALL\n";
                      }
                  }

                  if (g->watch.empty() && !g->watch_all)
                  {
                      for (const char* d : defaults)
                          g->watch.push_back(d);
                  }
              }
          }

          EXPORTED AurieStatus ModuleInitialize(
              IN AurieModule* Module,
              IN const std::filesystem::path& ModulePath
          )
          {
              sl::g = new sl::State();
              QueryPerformanceFrequency(&sl::g->freq);
              QueryPerformanceCounter(&sl::g->t0);

              // Open the log first, so that we can always see what happened (even when something fails below).
              std::filesystem::path dir = ModulePath.parent_path();
              std::string stem = ModulePath.stem().string(); // each DLL variant writes its own <dll name>.log
              sl::g->log.open(dir / (stem + ".log"), std::ios::app);

              SYSTEMTIME st{};
              GetLocalTime(&st);
              char header[400];
              std::snprintf(header, sizeof(header), "# session start %04d-%02d-%02d %02d:%02d:%02d (probe v4: %s), keys: F7 F8 F9 write MARK lines\n",
                  int(st.wYear), int(st.wMonth), int(st.wDay), int(st.wHour), int(st.wMinute), int(st.wSecond), stem.c_str());
              if (sl::g->log.is_open())
              {
                  sl::g->log << header;
                  sl::g->log.flush();
              }
              sl::Note("ModuleInitialize entered");

              sl::LoadWatch(dir);

              YYTKInterface* yytk = sl::AcquireInterface();
              if (!yytk)
              {
                  sl::Note("FATAL: could not get the YYToolkit interface");
                  return AURIE_MODULE_DEPENDENCY_NOT_RESOLVED;
              }
              sl::Note("calling CreateCallback(EVENT_OBJECT_CALL)");

              int status = -1;
              if (!sl::CreateCallbackGuarded(yytk, Module, &status))
              {
                  sl::Note("FATAL: access violation inside CreateCallback (interface layout mismatch?)");
                  return AURIE_MODULE_DEPENDENCY_NOT_RESOLVED;
              }
              std::string done = "CreateCallback status=" + std::to_string(status);
              sl::Note(done.c_str());
              return static_cast<AurieStatus>(status);
          }
          '@
          Set-Content -Path $ex.FullName -Value ($head + $body) -Encoding utf8

      - name: Use the Aurie v2.0.2 headers instead of any older vendored copy
        shell: pwsh
        run: |
          New-Item out -ItemType Directory -Force | Out-Null
          $cands = @(Get-ChildItem aurie -Recurse -Filter *.hpp | Where-Object { $_.FullName -match '[\\/]Aurie[\\/]shared\.hpp$' })
          $src = $cands | Where-Object { $_.FullName -notmatch 'Template|VSIX|Example' } | Select-Object -First 1
          if (-not $src) { $src = $cands | Select-Object -First 1 }
          if (-not $src) { throw "Aurie shared.hpp was not found in the Aurie v2.0.2 sources" }
          $srcDir = $src.Directory.FullName
          $root = $src.Directory.Parent.FullName
          $log = @("Aurie v2.0.2 shared dir: $srcDir", "include root: $root")
          $old = @(Get-ChildItem yytk -Recurse -Filter *.hpp | Where-Object { $_.FullName -match '[\\/]Aurie[\\/]shared\.hpp$' })
          foreach ($t in $old) {
            $log += "overwriting vendored copy in: $($t.Directory.FullName)"
            Copy-Item (Join-Path $srcDir '*') $t.Directory.FullName -Recurse -Force
          }
          if ($old.Count -eq 0) { $log += "no vendored copy found inside yytk" }
          $line = 'CL=/I"' + $root + '"'
          $line | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $log += "env: $line"
          $log | Out-File out/aurie_header_swap.txt
          $log | ForEach-Object { Write-Host $_ }

      - name: Collect header info (for troubleshooting)
        shell: pwsh
        run: |
          New-Item out -ItemType Directory -Force | Out-Null
          $info = "out/header_info.txt"
          "variant: ${{ matrix.name }}  commit: $(git -C yytk log -1 --format='%H %cI')" | Out-File $info
          $files = Get-ChildItem yytk/ExamplePlugin, yytk/YYToolkit/source/YYTK/Shared -Recurse -Include *.hpp,*.h,*.cpp -ErrorAction SilentlyContinue
          $files | Select-String -Pattern 'GetInterface|YYTK_Zeus|"YYTK_' | ForEach-Object { "$($_.Path):$($_.LineNumber): $($_.Line.Trim())" } | Out-File $info -Append
          $ih = Get-ChildItem yytk -Recurse -Filter YYTK_Shared_Interface.hpp | Select-Object -First 1
          if ($ih) {
            $n = @(Select-String -Path $ih.FullName -Pattern '^\s*virtual\s').Count
            "virtual lines in $($ih.Name): $n (the installed DLL has 33 vtable entries in total)" | Out-File $info -Append
          }
          Get-Content $info | Select-Object -First 40 | Write-Host

      - uses: microsoft/setup-msbuild@v2

      - name: Build
        shell: pwsh
        run: |
          $start = Get-Date
          New-Item out -ItemType Directory -Force | Out-Null
          Write-Host "CL env = $env:CL"
          $sln = Get-ChildItem yytk -Filter *.sln -Depth 1 | Select-Object -First 1
          $proj = Get-ChildItem yytk/ExamplePlugin -Filter *.vcxproj -Recurse | Select-Object -First 1
          if (-not $proj) { throw "No ExamplePlugin .vcxproj found" }
          Write-Host "solution: $($sln.FullName)"
          Write-Host "project:  $($proj.FullName)"
          $attempts = @()
          if ($sln) { $attempts += ,@($sln.FullName, "/t:ExamplePlugin", "/p:Configuration=Release", "/p:Platform=x64") }
          $attempts += ,@($proj.FullName, "/p:Configuration=Release", "/p:Platform=x64")
          $attempts += ,@($proj.FullName, "/p:Configuration=Release")
          $ok = $false
          $i = 0
          foreach ($a in $attempts) {
            $i++
            Write-Host "=== attempt ${i}: msbuild $($a -join ' ')"
            & msbuild @a /m /nologo /v:minimal *> "out/build_attempt_${i}.log"
            Get-Content "out/build_attempt_${i}.log" -Tail 40 | Write-Host
            if ($LASTEXITCODE -eq 0) { $ok = $true; break }
          }
          if (-not $ok) { Write-Host "ALL BUILD ATTEMPTS FAILED"; exit 1 }
          $dlls = @(Get-ChildItem yytk -Recurse -Filter *.dll | Where-Object { $_.LastWriteTime -gt $start })
          $dlls | ForEach-Object { Write-Host "new dll: $($_.FullName)" }
          $main = $dlls | Where-Object { $_.FullName -match 'ExamplePlugin' } | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $main) { $main = $dlls | Sort-Object LastWriteTime -Descending | Select-Object -First 1 }
          if (-not $main) { throw "Build succeeded but no new DLL was found" }
          $outdll = "out/ShawarmaEvents_${{ matrix.name }}.dll"
          Copy-Item $main.FullName $outdll
          Write-Host "Built: $($main.FullName) -> $outdll"
          $text = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes((Resolve-Path $outdll)))
          $hasDbg = $text.Contains('__AurieIsDebugBuild')
          "exports __AurieIsDebugBuild: $hasDbg" | Out-File out/dll_check.txt
          Write-Host "exports __AurieIsDebugBuild: $hasDbg"

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ShawarmaEvents-${{ matrix.name }}
          path: out

  pdb:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download the PDB (debug symbols) that belongs to the installed YYToolkit.dll
        shell: bash
        run: |
          mkdir -p pdb pdb_info
          gh release download v5.0.0c --repo AurieFramework/YYToolkit --pattern "YYToolkit.pdb" --dir pdb
          ls -la pdb

      - name: Install LLVM tools
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq llvm
          ls -la /usr/lib/llvm-*/bin/llvm-pdbutil || true

      - name: Dump the real interface layout from the PDB
        shell: bash
        run: |
          T=$(ls /usr/lib/llvm-*/bin/llvm-pdbutil 2>/dev/null | tail -1)
          echo "tool: $T" | tee pdb_info/tool_info.txt
          "$T" dump -types pdb/YYToolkit.pdb > types_all.txt 2> pdb_info/dump_stderr.txt || true
          ls -la types_all.txt | tee -a pdb_info/tool_info.txt
          wc -l types_all.txt | tee -a pdb_info/tool_info.txt
          {
            for pat in 'name = `CreateCallback`' 'EVENT_OBJECT_CALL' 'FWCodeEvent' 'YYTK::CCode`' 'YYTK::YYTKInterface`' 'AurieInterfaceBase`'; do
              echo "################ $pat"
              grep -n -F -m 3 -B 70 -A 70 -- "$pat" types_all.txt | head -450
            done
          } > pdb_info/pdb_grep.txt 2>&1 || true
          "$T" pretty -classes -enums -class-definitions=all -include='YYTKInterface|FWCodeEvent|CCode$|EventTriggers|AurieInterfaceBase' pdb/YYToolkit.pdb > pdb_info/pdb_pretty.txt 2>&1 || true
          gzip -9 -c types_all.txt > pdb_info/types_all.txt.gz || true
          ls -la pdb_info

      - name: Upload PDB info
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ShawarmaEvents-pdb-info
          path: pdb_info

  collect:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ShawarmaEvents-*
          path: all
      - name: Gather all DLLs into one folder
        shell: bash
        run: |
          mkdir -p result/info
          find all -name '*.dll' -exec cp {} result/ \;
          for d in all/*/; do
            n=$(basename "$d")
            mkdir -p "result/info/$n"
            cp "$d"*.txt "$d"*.log "$d"*.json "result/info/$n"/ 2>/dev/null || true
          done
          ls -R result
      - uses: actions/upload-artifact@v4
        with:
          name: ShawarmaEvents-ALL
          path: result
